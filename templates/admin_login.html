```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - WORLDLINK COURIER SERVICE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .admin-login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 45px;
            border-radius: 10px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .admin-login-box h1 {
            margin-bottom: 8px;
        }

        .admin-login-box .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .admin-login-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .admin-login-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-login-box button:hover {
            background: #000;
        }

        .error-message {
            margin-bottom: 20px;
            padding: 12px;
            background: #ffe8e8;
            color: #a00000;
            border-radius: 5px;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="admin-login-page">

    <div class="admin-login-box">

        <h1>WORLDLINK</h1>

        <p class="subtitle">
            Courier Service Administration
        </p>

        <h2>Admin Login</h2>

        <p>
            Authorized personnel only.
        </p>

        {% if message %}
        <div class="error-message">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">

            <input
                type="text"
                name="username"
                placeholder="Admin username"
                required
                autocomplete="username"
            >

            <input
                type="password"
                name="password"
                placeholder="Admin password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Secure Login
            </button>

        </form>

        <a href="/" class="back-home">
            ← Back to Homepage
        </a>

    </div>

</div>

</body>
</html>
```
